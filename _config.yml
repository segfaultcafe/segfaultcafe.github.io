title: Cecil Daemon's Wish
description: "Personal hacker's blog"
author:
  name: "J. Alex Buschinelli"
  email: "buschinellijoao@gmail.com"
  url: "https://alexbsec.github.io/"

baseurl: /
url: "https://segfaultcafe.github.io"

source: .
destination: ./_site
permalink: /:title
paginate: 3
paginate_path: /page/:num/

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

collections:
  pt_br_posts:
    output: true
    permalink: /pt-br/:name

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
  -
    scope:
      path: ""
      type: "pt_br_posts"
    values:
      layout: "post"
      lang: "pt-BR"

# Custom variables
owner : "Alex Buschinelli"
year : "2023"
